[package]
name = "simpcky-d2d"
version = "0.1.0"
edition = "2021"
description = "Demo: Simpcky dibujado con Direct2D + DirectWrite + DirectComposition, un solo dispositivo para todas las notas"
publish = false

[[bin]]
name = "simpcky-d2d"
path = "src/main.rs"

[dependencies]
common = { package = "simpcky-demo-common", path = "../common" }
windows-sys = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
