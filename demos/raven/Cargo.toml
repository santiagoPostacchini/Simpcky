[package]
name = "simpcky-raven"
version = "0.1.0"
edition = "2021"
description = "Demo: la interfaz de Simpcky hecha con Raven (Vulkan) en vez de Win32/GDI"
license = "MIT"
publish = false

# Crate aparte: no forma parte del build de la app (`cargo build` en la raíz
# no lo ve). Necesita raven.dll; ver README.md de esta carpeta.
[workspace]

[dependencies]
# Bindings de Raven, fijados al commit con el que se probó la demo.
raven-gui = { git = "https://github.com/oscar-soirey/Raven", rev = "3b1a4df67cc453f68f366ebdd4466c518e318795" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
