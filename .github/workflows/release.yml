# Publica una versión de Simpcky cuando se sube un tag vX.Y.Z:
# compila, arma el instalador, calcula su huella y crea el release.
# El actualizador de la app (src/update.rs) baja de acá el instalador y
# la huella. Ver docs/publicar-version.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # crear el release y subirle los archivos

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: El tag coincide con la versión de Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "El tag v$tag no coincide con la versión de Cargo.toml ($cargo)." }
          "VERSION=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test --release

      - name: Compilar (con el cliente de Google para la sincronización)
        shell: pwsh
        env:
          SIMPCKY_GOOGLE_CLIENT_ID: ${{ secrets.SIMPCKY_GOOGLE_CLIENT_ID }}
          SIMPCKY_GOOGLE_CLIENT_SECRET: ${{ secrets.SIMPCKY_GOOGLE_CLIENT_SECRET }}
        run: |
          # Sin los secretos, la app compilaría sin sincronización: mejor
          # que falle acá que publicar una versión a medias.
          if (-not $env:SIMPCKY_GOOGLE_CLIENT_ID -or -not $env:SIMPCKY_GOOGLE_CLIENT_SECRET) {
            throw "Faltan los secretos SIMPCKY_GOOGLE_CLIENT_ID y SIMPCKY_GOOGLE_CLIENT_SECRET (Settings → Secrets and variables → Actions)."
          }
          cargo build --release

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Armar el instalador y su huella
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\simpcky.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló ($LASTEXITCODE)." }
          $name = "Simpcky-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          # Formato de sha256sum ("<hash>  <archivo>"): lo lee el actualizador.
          "$hash  $name" | Out-File -Encoding ascii "dist\$name.sha256"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Publicar el release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist | ForEach-Object FullName) `
            --title "Simpcky $env:VERSION" --generate-notes
